<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>Dormouse</title>
  <!-- a dormouse curled into a ball, asleep on a red cushion -->
  <defs>
    <radialGradient id="fur" cx="45%" cy="38%" r="65%">
      <stop offset="0" stop-color="#ebb680"/>
      <stop offset="1" stop-color="#c47f45"/>
    </radialGradient>
    <radialGradient id="muzzle" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="1" stop-color="#f3dbbb"/>
    </radialGradient>
  </defs>

  <!-- cushion -->
  <ellipse cx="120" cy="198" rx="98" ry="26" fill="#b3122e"/>
  <ellipse cx="120" cy="192" rx="94" ry="22" fill="#d7263d"/>
  <ellipse cx="92" cy="186" rx="30" ry="6" fill="#ef5a6b" opacity="0.6"/>

  <!-- the curled body: one round ball -->
  <circle cx="132" cy="134" r="60" fill="url(#fur)"/>

  <!-- ears -->
  <circle cx="62" cy="84" r="21" fill="#c47f45"/>
  <circle cx="62" cy="84" r="12" fill="#f2a7a0"/>
  <circle cx="112" cy="76" r="21" fill="#c47f45"/>
  <circle cx="112" cy="76" r="12" fill="#f2a7a0"/>

  <!-- head, tucked against the body -->
  <circle cx="88" cy="122" r="42" fill="url(#fur)"/>
  <ellipse cx="80" cy="138" rx="24" ry="16" fill="url(#muzzle)"/>

  <!-- the fluffy tail wraps around the front and hides the feet -->
  <path d="M186 120 C 200 170, 160 190, 110 184 C 76 180, 52 170, 46 152"
        fill="none" stroke="#b5733d" stroke-width="32" stroke-linecap="round"/>
  <path d="M186 120 C 200 170, 160 190, 110 184 C 76 180, 52 170, 46 152"
        fill="none" stroke="#dea56c" stroke-width="20" stroke-linecap="round"/>
  <path d="M120 180 C 92 178, 70 172, 58 160"
        fill="none" stroke="#f0c38e" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- closed sleepy eyes -->
  <path d="M64 118 q 8 7 16 0" fill="none" stroke="#3b2414" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M98 116 q 8 7 16 0" fill="none" stroke="#3b2414" stroke-width="3.5" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="60" cy="132" rx="8" ry="5" fill="#f2a7a0" opacity="0.8"/>
  <ellipse cx="116" cy="130" rx="8" ry="5" fill="#f2a7a0" opacity="0.8"/>

  <!-- nose, mouth, whiskers -->
  <ellipse cx="88" cy="132" rx="5" ry="3.8" fill="#8a4b3a"/>
  <path d="M88 136 q -4 5 -8 2 M88 136 q 4 5 8 2" fill="none" stroke="#3b2414" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#7a5236" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="66" y1="136" x2="42" y2="132"/>
    <line x1="66" y1="140" x2="44" y2="144"/>
    <line x1="110" y1="136" x2="134" y2="130"/>
    <line x1="110" y1="140" x2="132" y2="144"/>
  </g>

  <!-- zzz -->
  <g fill="#7a5236" font-family="Georgia, serif" font-weight="bold">
    <text x="146" y="66" font-size="22">z</text>
    <text x="166" y="48" font-size="28">z</text>
    <text x="192" y="32" font-size="34">Z</text>
  </g>
</svg>
